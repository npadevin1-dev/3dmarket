<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин трехмерной графики</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0e0e12; color: #e0e0e6; padding: 25px 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { font-size: 1.8rem; color: #ff9933; text-shadow: 0 0 8px rgba(0, 255, 204, 0.25); margin-bottom: 6px; }
        header p { color: #828292; font-size: 0.95rem; }
        .market-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; max-width: 950px; width: 100%; }
        .card { background: #14141c; border: 1px solid #20202c; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.25s ease, border-color 0.25s ease; }
        .card:hover { transform: translateY(-3px); border-color: #ff9933; box-shadow: 0 6px 12px rgba(0, 255, 204, 0.1); }
        .card-image { height: 140px; background: #1b1b26; display: flex; align-items: center; justify-content: center; color: #44445c; font-weight: 600; font-size: 0.85rem; letter-spacing: 1px; }
        .card-content { padding: 16px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 1.1rem; margin-bottom: 8px; color: #ffffff; }
        .card-description { font-size: 0.85rem; color: #9090a2; line-height: 1.4; margin-bottom: 16px; flex-grow: 1; }
        .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
        .price { font-size: 1.15rem; font-weight: 700; color: #00ffcc; }
        .buy-button { background: #0088cc; color: #ffffff; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 0.85rem; transition: background 0.2s; }
        .buy-button:hover { background: #0099e6; }
    </style>
</head>
<body>
    <header>
        <h1>Магазин трехмерной графики</h1>
        <p>Выберите нужную услугу или готовую модель для вашего проекта</p>
    </header>
    <div class="market-container">
        <div class="card">
        <div class="card">
            <img src="images/IMG_20260719_120331_595.jpg" alt="Анархо-олень" style="width:100%; height:140px; object-fit:cover;">
            <div class="card-content">
                <h3 class="card-title">Анархо-олень</h3>
                <p class="card-description">Выполненная в трехмерной графике модель оленя</p>
                <div class="card-footer">
                    <span class="price">2000 ₽</span>
                    <button class="buy-button" onclick="orderService('Анархо-олень', '2000 ₽')">Заказать</button>
                </div>
            </div>
        </div>
    <script>
        function orderService(serviceName, price) {
            const tg = 'UnityAssetBundleExtractorAvaloni';
            const text = `Привет! Хочу заказать услугу "${serviceName}" (от ${price} руб).`;
            window.open(`https://t.me/${tg}?text=${encodeURIComponent(text)}`, '_blank');
        }
    </script>
</body>
</html>
