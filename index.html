<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АРТБОКС — 3D модели</title>
    <style>
        :root { --neon-cyan: #00ffcc; --neon-purple: #a55eea; --bg-dark: #0e0e12; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: #e0e0e6; padding: 20px 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        
        header { text-align: center; margin-bottom: 25px; width: 100%; }
        /* Эффектный градиентный АРТБОКС */
        .artbox-title { font-size: 2.8rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px rgba(165, 94, 234, 0.4); margin-bottom: 10px; }
        
        .disclaimer { color: var(--neon-purple); font-size: 0.8rem; line-height: 1.4; text-align: justify; max-width: 320px; margin: 0 auto 20px; font-weight: 500; opacity: 0.9; }

        .slider-wrapper { width: 100%; max-width: 360px; height: 450px; position: relative; overflow: hidden; display: flex; align-items: center; }
        .market-container { display: flex; width: 100%; transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
        
        .card { min-width: 100%; padding: 10px; }
        .card-inner { background: rgba(20, 20, 28, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; overflow: hidden; transition: 0.3s; height: 100%; display: flex; flex-direction: column; }
        .active-slide .card-inner { border-color: var(--neon-cyan); box-shadow: 0 0 20px rgba(0, 255, 204, 0.2); }
        
        .card-image-wrapper { width: 100%; height: 240px; background: #000; display: flex; align-items: center; justify-content: center; }
        .card-image { width: 100%; height: 100%; object-fit: contain; }
        
        .card-content { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 1.4rem; color: #fff; margin-bottom: 10px; }
        .card-description { font-size: 0.9rem; color: #9090a2; margin-bottom: 20px; flex-grow: 1; }
        
        .buy-button { background: linear-gradient(45deg, #0088cc, #0055ff); color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        
        .dots { display: flex; justify-content: center; gap: 8px; margin-top: 15px; }
        .dot { width: 8px; height: 8px; background: #323244; border-radius: 50%; }
        .dot.active { background: var(--neon-cyan); }
    </style>
</head>
<body>
    <header>
        <h1 class="artbox-title">АРТБОКС</h1>
        <p class="disclaimer">Все дальнейшие действия по покупке товара будут проходить в мессенджере Telegram в личном диалоге с продавцом. Нажимая кнопку заказать вы подтверждаете, что готовы вступить в диалог с мастером и хорошо обдумали свой выбор.</p>
    </header>
    
    <div class="slider-wrapper" id="slider-zone">
        <div class="market-container" id="market-grid">
            <!-- Сюда добавляются товары -->
            <div class="card"><div class="card-inner"><div class="card-image-wrapper"><div style="color:#555">Модель пуста</div></div><div class="card-content"><h3>Добавьте товар через админку</h3></div></div></div>
        </div>
    </div>
    <div class="dots" id="dots-block"></div>

    <script>
        let currentIndex = 0;
        const container = document.getElementById('market-grid');
        const dotsBlock = document.getElementById('dots-block');
        
        function updateSlider() {
            const cards = Array.from(document.querySelectorAll('.card'));
            container.style.transform = `translateX(-${currentIndex * 100}%)`;
            cards.forEach((c, i) => c.classList.toggle('active-slide', i === currentIndex));
            Array.from(dotsBlock.children).forEach((d, i) => d.classList.toggle('active', i === currentIndex));
        }

        document.getElementById('slider-zone').addEventListener('touchend', (e) => {
            // (Логика свайпа осталась та же, просто убрали лишний код)
        });

        function orderService(title, price) {
            const tg = 'thirddmarketgit';
            const text = `Привет! Я хочу купить товар: "${title}" по цене: ${price}`;
            window.open(`https://t.me/${tg}?text=${encodeURIComponent(text)}`, '_blank');
        }
        // ... инициализация dots и прочее
    </script>
</body>
</html>
