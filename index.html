<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Modeling Market</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0f0f12; color: #eeeeee; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { text-align: center; margin-bottom: 50px; }
        header h1 { font-size: 2.5rem; color: #00ffcc; text-shadow: 0 0 10px rgba(0, 255, 204, 0.3); margin-bottom: 10px; }
        header p { color: #8a8a98; font-size: 1.1rem; }
        .market-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; max-width: 1100px; width: 100%; }
        .card { background: #16161f; border: 1px solid #232330; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.3s ease, border-color 0.3s ease; }
        .card:hover { transform: translateY(-5px); border-color: #00ffcc; box-shadow: 0 10px 20px rgba(0, 255, 204, 0.1); }
        .card-image { height: 180px; background: #1f1f2e; display: flex; align-items: center; justify-content: center; color: #4e4e6a; font-weight: bold; font-size: 0.9rem; }
        .card-content { padding: 25px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 1.3rem; margin-bottom: 12px; color: #ffffff; }
        .card-description { font-size: 0.95rem; color: #a0a0b0; line-height: 1.5; margin-bottom: 25px; flex-grow: 1; }
        .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
        .price { font-size: 1.4rem; font-weight: 700; color: #00ffcc; }
        .buy-button { background: #0088cc; color: #ffffff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 0.95rem; }
        .buy-button:hover { background: #0099e6; }
    </style>
</head>
<body>
    <header>
        <h1>3D Modeling Market</h1>
        <p>Выберите нужную услугу для вашего проекта</p>
    </header>
    <div class="market-container">
        <div class="card">
            <img src="https://robotrends.ru/images/1711/872473/IMG_3958EL4.jpg" alt="Пожарный робот" style="width:100%; height:180px; object-fit:cover;">
            <div class="card-content">
                <h3 class="card-title">Пожарный робот</h3>
                <p class="card-description">Пожарный робот МЧС России</p>
                <div class="card-footer">
                    <span class="price">5000 ₽</span>
                    <button class="buy-button" onclick="orderService('Пожарный робот', '5000 ₽')">Заказать</button>
                </div>
            </div>
        </div>
        <div class="card">
    <script>
        function orderService(serviceName, price) {
            const tg = 'UnityAssetBundleExtractorAvaloni';
            const text = `Привет! Хочу заказать услугу "${serviceName}" (от ${price} руб).`;
            window.open(`https://t.me/${tg}?text=${encodeURIComponent(text)}`, '_blank');
        }
    </script>
</body>
</html>
